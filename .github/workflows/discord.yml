name: Discord Notifications

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
    - name: Send Discord message
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        curl -H "Content-Type: application/json" \
        -d '{
          "username": "Meloetta",
          "avatar_url": "https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/portrait/0648/Normal.png",
          "embeds": [
            {
              "title": "🎶 Nouveau push sur [${{ github.repository }}:${{ github.ref_name }}]",
              "description": "**${{ github.sha }}** ${{ github.event.head_commit.message }} - ${{ github.actor }}",
              "url": "https://github.com/${{ github.repository }}/commit/${{ github.sha }}",
              "color": 5763719
            }
          ]
        }' \
        "$DISCORD_WEBHOOK"