name: Discord Notifications

on:
  push:
    branches:
      - pokemon-libra
  pull_request:
    branches:
      - pokemon-libra
  release:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -i -H "Content-Type: application/json" \
          -d '{
            "username": "Meloetta",
            "avatar_url": "https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/portrait/0648/Normal.png",
            "embeds": [
              {
                "title": "🎶 Nouveau push sur ${{ github.repository }}",
                "description": "Auteur : ${{ github.actor }}",
                "url": "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
              }
            ]
          }' \
          "$DISCORD_WEBHOOK"